name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CRAWL4_AI_BASE_DIRECTORY: ${{ github.workspace }}/.crawl-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests examples/offline tools
      - run: uv run python -m tools.run_acceptance --output output/acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-acceptance
          path: |
            output/acceptance-*/report.json
            output/acceptance-*/report.md
            output/acceptance-*/junit.xml
            output/acceptance-*/pytest.log
          if-no-files-found: error
